name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# 构建基线检查：配置、构建、测试、格式。
# 构建失败时保留日志，避免只看到“红叉”而无法定位。

permissions:
  contents: read

env:
  CMAKE_GENERATOR: Ninja
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # 让 CMake 使用 ccache，否则缓存目录不会被写入，缓存步骤形同虚设。
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  build-and-test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      # clang-format 必须与开发环境同主版本（21.x），不能用 ubuntu-24.04 源里的
      # 18.x：默认换行/对齐策略跨版本会变，同一个文件两边判定不一致，表现为
      # **本地绿、CI 红**，而门禁无法在本地复现（实测踩到：PR #16 三个预设全红，
      # 原因只是 src/gateway/stream_hub.cpp 在 18 与 21 下的判定不同）。
      # scripts/check-format.sh 会校验主版本并在不符时明确报错，两边读同一处要求。
      - name: 安装 clang-format 21（版本必须与开发环境一致）
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-21 main" |
            sudo tee /etc/apt/sources.list.d/llvm-21.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y clang-format-21
          # 让 `clang-format` 指向 21，脚本与本地都按同一命令调用。
          sudo ln -sf /usr/bin/clang-format-21 /usr/local/bin/clang-format

      - name: 缓存编译产物
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.preset }}-

      - name: 显示工具版本
        run: |
          cmake --version | head -1
          g++ --version | head -1
          ninja --version
          clang-format --version

      - name: 配置
        run: cmake --preset ${{ matrix.preset }}

      - name: 构建
        run: cmake --build --preset ${{ matrix.preset }}

      - name: 测试
        run: ctest --preset ${{ matrix.preset }}

      - name: 格式检查
        run: bash scripts/check-format.sh

      - name: 失败时上传测试日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/Testing/
          if-no-files-found: ignore
          retention-days: 7
