// Gateway 对外接口契约。
//
// 说明：
//   * 浏览器通过 Gateway 的 HTTP 接口访问，本文件同时是 HTTP 接口与内部
//     RPC 的契约来源。路径与字段依据 docs/05-api-and-data.md 第 2 节。
//   * 字段只追加，不修改既有标签号；删除字段必须先标记 reserved。
//   * TASK-005 只包含登录切片：登录、查询当前玩家、登出。
//     匹配与房间接口在后续任务中追加。

syntax = "proto3";

package rgbt.gateway.v1;

option cc_generic_services = true;

// ---------------------------------------------------------------------------
// 公共结构
// ---------------------------------------------------------------------------

// 玩家公开信息。不包含密码、Token 等敏感字段。
message PlayerInfo {
  // 玩家唯一标识。
  string player_id = 1;

  // 展示名。
  string display_name = 2;

  // 账号状态。取值：active / disabled。
  string status = 3;
}

// 错误码。与 docs/05-api-and-data.md 第 3 节的分类对应：
//   INVALID_ARGUMENT   输入错误，调用方不应重试
//   UNAUTHENTICATED    凭证缺失或无效
//   NOT_FOUND          资源不存在
//   UNAVAILABLE        依赖暂时失败，可有限重试
//   INTERNAL           未分类内部错误
//   RESOURCE_EXHAUSTED 限流，退避后重试（TASK-007 新增：匹配队列已满）
//   CONFLICT           状态冲突，操作在当前状态下不被接受（TASK-008 新增：对局已结束）
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  INVALID_ARGUMENT = 1;
  UNAUTHENTICATED = 2;
  NOT_FOUND = 3;
  UNAVAILABLE = 4;
  INTERNAL = 5;
  RESOURCE_EXHAUSTED = 6;
  CONFLICT = 7;
}

// 统一错误体。
message Error {
  ErrorCode code = 1;

  // 稳定可判定的错误标识，例如 invalid_credential。
  string reason = 2;

  // 面向开发者的描述，不包含敏感信息。
  string message = 3;

  // 请求追踪 ID，与请求中的 request_id 对应。
  string request_id = 4;
}

// ---------------------------------------------------------------------------
// 登录
// ---------------------------------------------------------------------------

message LoginRequest {
  // 玩家账号名。长度 1..64。
  string account = 1;

  // 玩家密码。长度 1..128。仅用于校验，不写入日志。
  string password = 2;

  // 幂等键。同一 request_id 重复登录返回同一会话，不重复创建。
  string request_id = 3;

  // 客户端类型，用于会话记录。取值：web / bot。
  string client_type = 4;
}

message LoginResponse {
  // HTTP 状态码语义。200 成功；其余与 error.code 对应。
  int32 status_code = 1;

  // 成功时返回。
  string token = 2;

  // Token 有效期（秒）。
  int32 expires_in_seconds = 3;

  PlayerInfo player = 4;

  // 失败时返回。
  Error error = 5;
}

// ---------------------------------------------------------------------------
// 当前玩家
// ---------------------------------------------------------------------------

message GetCurrentPlayerRequest {
  // 会话 Token。缺失或无效返回 UNAUTHENTICATED。
  string token = 1;

  string request_id = 2;
}

message GetCurrentPlayerResponse {
  int32 status_code = 1;

  PlayerInfo player = 2;

  Error error = 3;
}

// ---------------------------------------------------------------------------
// 登出
// ---------------------------------------------------------------------------

message LogoutRequest {
  string token = 1;

  string request_id = 2;
}

message LogoutResponse {
  int32 status_code = 1;

  Error error = 2;
}

// ---------------------------------------------------------------------------
// 匹配（TASK-007）
// ---------------------------------------------------------------------------
//
// 这三个接口是 Gateway 对浏览器的入口，Gateway 自己不保存任何队列状态：
// 它把请求转给 Match Service（契约见 api/proto/match.proto），把结果整理后返回。
// 这是本项目第一次出现服务间调用，因此错误语义必须明确：
//   * Match 不可用      -> 503 UNAVAILABLE，reason = match_unavailable
//   * 队列已满          -> 429，reason = match_queue_full（限流类，可退避重试）
//   * 玩家已在队列      -> 200，body 中 state = queued（幂等，不是错误）
//   * 玩家标识           -> 一律取自会话，忽略请求体，避免冒名入队

// 匹配状态快照。state 取值：idle / queued / matched / timeout。
message MatchStatusInfo {
  // 与之对应的 Match 侧枚举在 api/proto/match.proto 中。这里用字符串是为了让
  // 浏览器直接可用，不必依赖枚举数字。
  string state = 1;

  // state == matched 时有效。
  string match_id = 2;
  string room_id = 3;

  // 同局玩家，包含自己。
  repeated string player_ids = 4;

  // 入队时间（Unix 毫秒）。
  int64 queued_at_ms = 5;

  // 当前队列长度，便于客户端与排障时判断「为什么还没匹配上」。
  int32 queue_size = 6;
}

message EnqueueMatchRequest {
  // 会话 Token。缺失或无效返回 UNAUTHENTICATED。
  string token = 1;

  // 幂等键。同一 request_id 与同一玩家重复入队不产生第二条队列记录。
  string request_id = 2;
}

message EnqueueMatchResponse {
  int32 status_code = 1;

  // 成功（含「已在队列」）时返回当前状态。
  MatchStatusInfo match = 2;

  Error error = 3;
}

message GetMatchStatusRequest {
  string token = 1;

  string request_id = 2;
}

message GetMatchStatusResponse {
  int32 status_code = 1;

  MatchStatusInfo match = 2;

  Error error = 3;
}

message CancelMatchRequest {
  string token = 1;

  string request_id = 2;
}

message CancelMatchResponse {
  int32 status_code = 1;

  MatchStatusInfo match = 2;

  Error error = 3;
}

// ---------------------------------------------------------------------------
// 房间与对局结果（TASK-008）
// ---------------------------------------------------------------------------
//
// Gateway 自己不保存房间状态：它把请求转给 Room/Battle Service
// （契约见 api/proto/room.proto），把结果整理后返回。
//
// 路径说明：文档原写 `GET /api/v1/rooms/{room_id}`，但实测确认 **brpc 的 restful
// 映射不支持 `{name}` 路径参数**，只支持 `*` 通配符；而 `/api/v1/rooms/*` 会与
// `/api/v1/rooms/join`、`/api/v1/rooms/input` 这类固定子路径产生歧义。
// 因此 room_id 与 match_id 改走**查询参数**。这是框架约束，不是偏好。
//
// 错误语义：
//   * Room 不可用            -> 503 UNAVAILABLE，reason = room_unavailable
//   * 房间/结果不存在         -> 404 NOT_FOUND
//   * 对局已结束              -> 409 CONFLICT，reason = room_already_finished
//   * 已结束但结果尚未落库     -> 503 UNAVAILABLE，reason = result_pending（可稍后重试）
//   * 玩家标识                -> 一律取自会话，忽略请求体，避免冒名加入或代打

// 玩家在对局中的权威状态。
message RoomPlayerInfo {
  string player_id = 1;
  int32 hp = 2;
  bool connected = 3;
}

// 房间权威状态快照。state 取值：
// created / waiting / playing / finishing / finished / aborted。
// finish_reason 取值：none / hp_zero / timeout / aborted。
message RoomStateInfo {
  string room_id = 1;
  string match_id = 2;
  string state = 3;
  int64 frame = 4;
  repeated RoomPlayerInfo players = 5;
  string finish_reason = 6;

  // 胜者 player_id。平局或未结束时为空。**空字符串表示平局**，与「没有结果」不同。
  string winner_id = 7;

  int64 started_at_ms = 8;
  int64 finished_at_ms = 9;
}

message JoinRoomRequest {
  string token = 1;
  string request_id = 2;

  // 要加入的房间。必须来自匹配结果，不能由客户端随意构造后当成有效房间使用：
  // Room 会校验调用者是否是这一局的成员。
  string room_id = 3;
}

message JoinRoomResponse {
  int32 status_code = 1;
  RoomStateInfo room = 2;
  Error error = 3;
}

message SubmitInputRequest {
  string token = 1;
  string request_id = 2;
  string room_id = 3;
}

message SubmitInputResponse {
  int32 status_code = 1;

  // 提交后的房间快照。调用方据此更新血量显示，不必再查一次。
  RoomStateInfo room = 2;
  Error error = 3;
}

message GetRoomStateRequest {
  string token = 1;
  string request_id = 2;
  string room_id = 3;
}

message GetRoomStateResponse {
  int32 status_code = 1;
  RoomStateInfo room = 2;
  Error error = 3;
}

// 对局结果。与 MySQL 的 match_results 表一一对应。
message MatchResultInfo {
  string match_id = 1;
  string room_id = 2;
  string winner_id = 3;
  int32 player_count = 4;
  int64 started_at_ms = 5;
  int64 finished_at_ms = 6;
}

message GetMatchResultRequest {
  string token = 1;
  string request_id = 2;
  string match_id = 3;
}

message GetMatchResultResponse {
  int32 status_code = 1;

  // 结果已落库时有效。reason = result_pending 时本字段为空，调用方不得据此推断胜负。
  MatchResultInfo result = 2;

  // 结果尚未落库时，Room 会一并返回房间快照，便于判断对局是否已结束。
  RoomStateInfo room = 3;

  Error error = 4;
}

// ---------------------------------------------------------------------------
// 服务定义
// ---------------------------------------------------------------------------

service GatewayService {
  // 使用测试身份登录，创建会话并返回 Token。
  // HTTP: POST /api/v1/login
  rpc Login(LoginRequest) returns (LoginResponse);

  // 查询当前 Token 对应的玩家信息。
  // HTTP: GET /api/v1/players/me
  rpc GetCurrentPlayer(GetCurrentPlayerRequest) returns (GetCurrentPlayerResponse);

  // 主动结束会话。
  // HTTP: POST /api/v1/logout
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // 进入匹配队列。
  // HTTP: POST /api/v1/matches
  rpc EnqueueMatch(EnqueueMatchRequest) returns (EnqueueMatchResponse);

  // 查询当前匹配状态。客户端轮询本接口获取匹配结果。
  // HTTP: GET /api/v1/matches/current
  rpc GetMatchStatus(GetMatchStatusRequest) returns (GetMatchStatusResponse);

  // 取消匹配。玩家不在队列时按幂等成功处理。
  // HTTP: POST /api/v1/matches/current/cancel
  // 注意：不是文档原先写的 DELETE /api/v1/matches/current。brpc 的 restful
  // 映射按**路径**分派，不支持按 HTTP 方法分派，因此取消与查询不能共用同一路径。
  // docs/05-api-and-data.md 第 2 节的接口表已同步修正。
  rpc CancelMatch(CancelMatchRequest) returns (CancelMatchResponse);

  // 加入房间。重复加入按幂等成功处理。
  // HTTP: POST /api/v1/rooms/join
  rpc JoinRoom(JoinRoomRequest) returns (JoinRoomResponse);

  // 提交一次攻击输入。
  // HTTP: POST /api/v1/rooms/input
  // 说明：TASK-009 落地 WebSocket 后，本接口与房间状态轮询一起作为兜底保留
  // （与匹配的轮询接口同一考虑）。
  rpc SubmitInput(SubmitInputRequest) returns (SubmitInputResponse);

  // 查询房间权威状态。客户端轮询本接口获取对局进展。
  // HTTP: GET /api/v1/rooms/state?room_id=...
  rpc GetRoomState(GetRoomStateRequest) returns (GetRoomStateResponse);

  // 查询对局结果。结果尚未落库时返回 503 result_pending，而不是空结果。
  // HTTP: GET /api/v1/results?match_id=...
  rpc GetMatchResult(GetMatchResultRequest) returns (GetMatchResultResponse);
}
