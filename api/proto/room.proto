// Room/Battle Service 的服务间契约。
//
// 说明：
//   * Room/Battle 拥有房间权威状态、快照与 match_results 表
//     （docs/01-architecture.md 第 3、5 节，docs/adr/0003-scope-reduction.md）。
//   * 对局同步方式为**最小状态同步**（D-003）：服务端权威快照 + 广播。
//     TASK-008 阶段客户端通过 Gateway 轮询 GetRoomState 获取快照；
//     服务端主动推送（SSE）属 TASK-009，见 docs/adr/0004-sse-instead-of-websocket.md。
//   * 字段只追加，不修改既有标签号；删除字段必须先标记 reserved。
//   * 本文件是**第三个服务间契约**（前两个是 gateway.proto、match.proto），沿用
//     同样的约定：每个请求带 request_id，每个响应带可判定的 error.reason。
//   * 对局规则的最小定义（TASK-008 决策 A）：
//       - 两人一局，与 Match 的 FIFO 两人配对一致。
//       - 服务端按固定 tick 推进权威状态，玩家输入只有「攻击」一种。
//       - 一方 HP 归零则该方落败；达到最大帧数时 HP 高者胜，相同为平局。
//     具体数值集中在 src/room/battle_room.hpp，不在本契约里固化。

syntax = "proto3";

package rgbt.room.v1;

option cc_generic_services = true;

// ---------------------------------------------------------------------------
// 公共结构
// ---------------------------------------------------------------------------

// 房间生命周期状态。
//
// FINISHING 必须与 FINISHED 分开：前者是「已分出胜负但结果尚未落库」，
// 后者是「结果已确认写入」。合并成一个状态会让调用方无法区分
// 「对局没有结果」和「结果暂时查不到」，也无法在数据库不可用时给出正确语义。
enum RoomState {
  ROOM_STATE_UNSPECIFIED = 0;

  // 已创建，尚未有人加入。
  ROOM_STATE_CREATED = 1;

  // 至少一人加入，等待双方到齐。
  ROOM_STATE_WAITING = 2;

  // 双方到齐，tick 正在推进。
  ROOM_STATE_PLAYING = 3;

  // 已分出胜负，结果尚未写入 MySQL。每个 tick 会重试写入。
  ROOM_STATE_FINISHING = 4;

  // 结果已写入 MySQL。
  ROOM_STATE_FINISHED = 5;

  // 异常终止（人数不足、超时等），**不写**对局结果。
  ROOM_STATE_ABORTED = 6;
}

// 对局结束原因。
enum FinishReason {
  FINISH_REASON_UNSPECIFIED = 0;

  // 一方 HP 归零。
  FINISH_REASON_HP_ZERO = 1;

  // 达到最大帧数，按 HP 判定。
  FINISH_REASON_TIMEOUT = 2;

  // 异常终止，未产生胜负。
  FINISH_REASON_ABORTED = 3;

  // TASK-016：一方在宽限期内没有回来，判其负。
  //
  // 与 ABORTED 的区别是**它产生胜负**：会正常写入 match_results。
  // 只有"双方都断线且都没回来"才走 ABORTED（那一局没有任何一方值得判负）。
  FINISH_REASON_DISCONNECT = 4;
}

// 房间错误码。与 docs/05-api-and-data.md 第 3 节的分类对应：
//   INVALID_ARGUMENT       输入错误，调用方不应重试
//   NOT_FOUND              房间或对局结果不存在
//   ALREADY_FINISHED       对局已结束，不再接受输入
//   RESULT_PENDING         已分出胜负但结果尚未落库，可稍后重试
//   STORE_UNAVAILABLE      对端存储（MySQL）暂时不可用，可有限重试
//   NOT_A_MEMBER           该玩家不是这一局的成员
//   NOT_PLAYING            对局尚未开始，此时不接受输入
//   SHUTTING_DOWN          服务正在排空（收到停止信号），不再接受新房间
//   INTERNAL               未分类内部错误
//
// 为什么 NOT_A_MEMBER 与 NOT_PLAYING 要有独立错误码，而不是复用 INVALID_ARGUMENT
// 再靠 reason 区分：**调用方只映射错误码**（见 src/gateway/brpc_room_client.cpp）。
// 把区别放在自由文本的 reason 里，跨进程后必然丢失——Gateway 会把「不是本局成员」
// 报成「参数不合法」。契约要能承载调用方真正需要的区分。
enum RoomErrorCode {
  ROOM_ERROR_CODE_UNSPECIFIED = 0;
  ROOM_INVALID_ARGUMENT = 1;
  ROOM_NOT_FOUND = 2;
  ROOM_ALREADY_FINISHED = 3;
  ROOM_RESULT_PENDING = 4;
  ROOM_STORE_UNAVAILABLE = 5;
  ROOM_INTERNAL = 6;
  ROOM_NOT_A_MEMBER = 7;
  ROOM_NOT_PLAYING = 8;

  // TASK-026：服务正在排空（收到 SIGTERM），**不再接受新房间**。
  //
  // 为什么需要一个独立错误码而不是复用 INTERNAL：调用方（Match）要据此把玩家
  // **退回队列**并记一条明确的日志，而不是把"服务正在退出"当成内部故障。
  // 契约要能承载调用方真正需要的区分——与 NOT_A_MEMBER / NOT_PLAYING 同理。
  ROOM_SHUTTING_DOWN = 9;
}

// 统一错误体。
message RoomError {
  RoomErrorCode code = 1;

  // 稳定可判定的错误标识，例如 room_not_found。
  string reason = 2;

  // 面向开发者的描述，不包含敏感信息。
  string message = 3;

  // 与请求中的 request_id 对应，便于跨服务追踪。
  string request_id = 4;
}

// 玩家在对局中的权威状态。
message PlayerState {
  string player_id = 1;

  // 当前 HP，不会低于 0。
  int32 hp = 2;

  // 该玩家当前是否在房间内（已加入且未离开）。
  //
  // 注意语义：这不是「网络是否连通」。PLAYING 及之后恒为 true；
  // 在 WAITING 期间尚未加入的玩家为 false。**判断网络连通请看 online。**
  bool connected = 3;

  // TASK-016：该玩家的推送连接当前是否在线。
  //
  // 为什么不让 connected 承担这个含义：它已经被 `rooms.pN_joined` 与快照校验
  // （"PLAYING 的房间必须双方都已加入"）依赖，改语义会破坏 TASK-014 的恢复逻辑。
  // 而且「在房间里」与「网络通着」本来就是两个事实：断线的玩家仍然在房间里。
  //
  // 断线后进入宽限期（见 src/room/room_types.hpp 的 kReconnectGraceMs）：
  // 期内对局**暂停推进**，回来接上继续打；到期未归则判负（FINISH_REASON_DISCONNECT）。
  bool online = 4;
}

// 房间权威状态快照。每 tick 生成一份，Phase 1 通过查询接口下发。
message RoomSnapshot {
  string room_id = 1;
  string match_id = 2;

  RoomState state = 3;

  // 当前帧号，从 0 开始。房间未开始时为 0。
  int64 frame = 4;

  repeated PlayerState players = 5;

  // 仅在 state >= FINISHING 时有意义。
  FinishReason finish_reason = 6;

  // 胜者 player_id。平局或未结束时为空。
  string winner_id = 7;

  // 开局与结束时间（Unix 毫秒）。未开始或未结束时为 0。
  int64 started_at_ms = 8;
  int64 finished_at_ms = 9;
}

// 对局结果。与 MySQL 的 match_results 表一一对应。
message MatchResult {
  string match_id = 1;
  string room_id = 2;

  // 胜者 player_id。平局为空字符串（数据库中为 NULL）。
  string winner_id = 3;

  int32 player_count = 4;
  int64 started_at_ms = 5;
  int64 finished_at_ms = 6;
}

// 玩家输入。TASK-008 只有一种输入类型，因此用带 kind 的消息而不是 oneof：
// 后续新增输入类型时只需追加枚举值，不改变既有字段语义。
message PlayerInput {
  enum Kind {
    KIND_UNSPECIFIED = 0;

    // 攻击。对对手造成固定伤害，数值定义在服务端常量中。
    KIND_ATTACK = 1;
  }

  Kind kind = 1;
}

// ---------------------------------------------------------------------------
// 创建房间
// ---------------------------------------------------------------------------

message CreateRoomRequest {
  // 幂等键。
  string request_id = 1;

  // **本接口的幂等业务键**。同一 match_id 重复调用返回同一个 room_id，
  // 不会创建第二个房间。这保证 Match 在重试时不会造出多个房间。
  string match_id = 2;

  // 本局玩家。Phase 1 固定两人。
  repeated string player_ids = 3;
}

message CreateRoomResponse {
  RoomError error = 1;

  string room_id = 2;

  // 创建后的初始快照（state = CREATED）。
  RoomSnapshot room = 3;
}

// ---------------------------------------------------------------------------
// 加入房间
// ---------------------------------------------------------------------------

message JoinRoomRequest {
  string request_id = 1;
  string room_id = 2;

  // 玩家标识。**必须由 Gateway 从会话中填充**，不得使用客户端提交的值。
  string player_id = 3;
}

message JoinRoomResponse {
  RoomError error = 1;

  // 加入后的最新快照。双方到齐时 state 变为 PLAYING。
  RoomSnapshot room = 2;
}

// ---------------------------------------------------------------------------
// 提交输入
// ---------------------------------------------------------------------------

message SubmitInputRequest {
  string request_id = 1;
  string room_id = 2;
  string player_id = 3;

  PlayerInput input = 4;
}

message SubmitInputResponse {
  RoomError error = 1;

  // 输入是否被接受。对局已结束或玩家不在房间时为 false，
  // 具体原因见 error。
  bool accepted = 2;

  RoomSnapshot room = 3;
}

// ---------------------------------------------------------------------------
// 查询房间状态
// ---------------------------------------------------------------------------

message GetRoomStateRequest {
  string request_id = 1;
  string room_id = 2;
}

message GetRoomStateResponse {
  RoomError error = 1;

  RoomSnapshot room = 2;
}

// ---------------------------------------------------------------------------
// 查询对局结果
// ---------------------------------------------------------------------------

message GetMatchResultRequest {
  string request_id = 1;

  // 对局标识，即 match_results 表的主键。
  string match_id = 2;
}

message GetMatchResultResponse {
  RoomError error = 1;

  // 仅当结果已写入时有效。结果为 RESULT_PENDING 时本字段为空，
  // 调用方**不得**据此推断对局结果，必须区分「还没有结果」与「结果是平局」。
  MatchResult result = 2;

  // 结果未落库但房间已知时的房间快照，便于调用方判断对局是否已结束。
  RoomSnapshot room = 3;
}

// ---------------------------------------------------------------------------
// 查询房间快照历史（TASK-017）
// ---------------------------------------------------------------------------
//
// 用途：Gateway 建立 SSE 订阅时若带上了 `Last-Event-ID`，就用本接口把客户端
// 错过的帧补发出去。为什么由 Gateway 补发而不是 Room 主动推：Room 是纯 brpc
// server，没有推送能力；推送链路的形态见
// docs/adr/0004-sse-instead-of-websocket.md。
//
// **本接口不承诺超出内存环形缓冲的历史**。缓冲只有 kMaxSnapshotHistory 帧
// （128 帧 ≈ 12.8 秒），更早的帧已经不存在了，因此调用方必须能处理
// `SNAPSHOTS_INCOMPLETE`——对客户端表现为一个明确的「需要全量刷新」，
// 而不是假装补上了。

// 快照窗口的判定结果。
//
// 为什么不用错误码表达（TASK-017）：这四种情况**都不是错误**，接口调用成功、
// 房间也还在，区别只在于「能不能把缺的帧补齐」。用 RoomErrorCode 表达会让调用方在
// "业务失败"与"补不齐"之间做出错误的重试决策——后者重试一万次也一样，
// 因为那段历史已经不在内存缓冲里了。
enum SnapshotWindowStatus {
  SNAPSHOT_WINDOW_STATUS_UNSPECIFIED = 0;

  // 请求区间被完整覆盖，`snapshots` 里是全部缺失帧（帧号严格递增）。
  SNAPSHOTS_READY = 1;

  // 请求的帧号早于环形缓冲中最早的一帧：中间有一段**已经不可恢复**。
  // 调用方应要求客户端全量刷新，而不是从这里的 snapshots 接着往下走。
  SNAPSHOTS_INCOMPLETE = 2;

  // 请求的帧号晚于房间当前帧号。正常流程下不会出现（帧号单调递增），
  // 出现即说明客户端状态与服务端不一致，同样应全量刷新。
  SNAPSHOTS_AHEAD = 3;
}

message GetRoomSnapshotsSinceRequest {
  string request_id = 1;
  string room_id = 2;

  // 客户端已有的最新帧号（来自 SSE 的 `Last-Event-ID`）。
  // 返回**帧号严格大于**它的快照。取负值等价于 0。
  int64 since_frame = 3;
}

message GetRoomSnapshotsSinceResponse {
  RoomError error = 1;

  SnapshotWindowStatus status = 2;

  // 帧号严格大于 since_frame 的快照，按帧号**递增且不重复**。
  // 同一帧号在缓冲里可能有多条（同一帧的状态多次变化），这里只返回该帧最新的一份。
  repeated RoomSnapshot snapshots = 3;

  // 环形缓冲当前的帧号区间，便于调用方解释"为什么补不齐"。
  // 缓冲为空时为 0。
  int64 oldest_frame = 4;
  int64 latest_frame = 5;
}

// ---------------------------------------------------------------------------
// 上报玩家连接状态（TASK-016）
// ---------------------------------------------------------------------------

// 「socket 断了」这个事实只有 Gateway 知道（SSE 是长连接，客户端断开时服务端
// 收不到显式通知，只能靠写失败感知，见 StreamHub 的说明）；而「这一局怎么办」
// 是房间的权威状态，属于 Room。因此由 Gateway 在订阅建立/移除时上报本接口。
message SetPlayerPresenceRequest {
  string request_id = 1;
  string room_id = 2;
  string player_id = 3;

  // true = 该玩家的推送连接已建立；false = 已断开（进入宽限期）。
  bool connected = 4;
}

message SetPlayerPresenceResponse {
  RoomError error = 1;

  // 上报后的房间快照。调用方一般不需要，但排障时能直接看到宽限期状态。
  RoomSnapshot room = 2;
}

// ---------------------------------------------------------------------------
// 服务定义
// ---------------------------------------------------------------------------

service RoomService {
  // 创建房间。以 match_id 为幂等键，重复调用返回同一房间。
  rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);

  // 加入房间。重复加入同一房间按幂等成功处理。
  rpc JoinRoom(JoinRoomRequest) returns (JoinRoomResponse);

  // 提交玩家输入。对局已结束时返回 accepted = false。
  rpc SubmitInput(SubmitInputRequest) returns (SubmitInputResponse);

  // 查询房间权威状态快照。TASK-008 期间客户端轮询本接口。
  rpc GetRoomState(GetRoomStateRequest) returns (GetRoomStateResponse);

  // 查询对局结果。结果尚未落库时返回 RESULT_PENDING，而不是空结果。
  rpc GetMatchResult(GetMatchResultRequest) returns (GetMatchResultResponse);

  // 查询帧号大于给定值的历史快照，供 Gateway 在 SSE 重连时补发（TASK-017）。
  // 超出内存环形缓冲的部分不可恢复，用 status = SNAPSHOTS_INCOMPLETE 如实告知。
  rpc GetRoomSnapshotsSince(GetRoomSnapshotsSinceRequest) returns (GetRoomSnapshotsSinceResponse);

  // 上报玩家的推送连接状态（TASK-016）。幂等：重复上报同一状态无副作用。
  rpc SetPlayerPresence(SetPlayerPresenceRequest) returns (SetPlayerPresenceResponse);
}
